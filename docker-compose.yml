services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - server/.env
    environment:
      NODE_ENV: production
      PORT: "3001"
    volumes:
      # заявки-бэкап и список подписчиков бота переживают пересборку образа
      - ./server/data:/app/server/data
